groups:
  - name: vodc-runtime
    rules:
      - alert: VodcApiUnavailable
        expr: up{job="vodc-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: VODC API недоступен

      - alert: VodcAllChatReplicasUnavailable
        expr: sum(up{job=~"vllm-(primary|secondary)"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Обе chat-реплики vLLM недоступны

      - alert: VodcChatReplicaDegraded
        expr: sum(up{job=~"vllm-(primary|secondary)"}) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Доступна только одна chat-реплика vLLM

      - alert: VodcEmbeddingUnavailable
        expr: up{job="vllm-embedding"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Embedding-сервис vLLM недоступен

      - alert: VodcWorkerUnavailable
        expr: up{job="vodc-worker"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Worker базы знаний недоступен

      - alert: VodcKnowledgeIngestionFailed
        expr: increase(vodc_knowledge_ingestion_runs_total{result="error"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Последний цикл индексации базы знаний завершился ошибкой

      - alert: VodcModelTtftHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(vodc_model_time_to_first_token_seconds_bucket[5m]))) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: p95 TTFT model gateway превышает 10 секунд

      - alert: VodcUnsafeModelOutput
        expr: sum(increase(vodc_guardrail_decisions_total{direction="output",decision!="allow"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Output guardrail отклонил ответ локальной модели

      - alert: VodcPiiInputSpike
        expr: sum(increase(vodc_guardrail_decisions_total{direction="input",decision="pii"}[15m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Чат часто отклоняет ввод с персональными данными

  - name: vodc-gpu
    rules:
      - alert: VodcGpuTelemetryUnavailable
        expr: up{job="nvidia-gpu"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: NVIDIA DCGM Exporter недоступен

      - alert: VodcGpuTemperatureHigh
        expr: DCGM_FI_DEV_GPU_TEMP >= 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Температура GPU выше 85°C

      - alert: VodcGpuXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: NVIDIA GPU сообщил XID-ошибку
