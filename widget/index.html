<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Информационный помощник ВОККДЦ</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <aside id="proactiveInvite" class="proactive-invite" hidden aria-live="polite">
        <button id="closeInvite" class="icon-button invite-close" type="button"
                aria-label="Закрыть приглашение">×</button>
        <strong>Помочь найти услугу?</strong>
        <span>Подскажу официальный материал и путь к записи.</span>
        <button id="acceptInvite" class="primary-button" type="button">Открыть чат</button>
    </aside>

    <section id="chatWidget" class="chat-widget" role="dialog"
             aria-label="Информационный помощник ВОККДЦ" hidden>
        <header class="chat-header">
            <div>
                <strong>Помощник ВОККДЦ</strong>
                <span id="connectionStatus" class="connection-status">Готов к работе</span>
            </div>
            <button id="closeChat" class="icon-button" type="button"
                    aria-label="Свернуть чат">−</button>
        </header>

        <div id="chatMessages" class="chat-messages"
             role="log" aria-live="polite" aria-relevant="additions"></div>

        <div id="quickReplies" class="quick-replies"
             aria-label="Быстрые ответы"></div>

        <div id="typingIndicator" class="typing-indicator" hidden aria-live="polite">
            <span></span><span></span><span></span>
            <span class="sr-only">Помощник формирует ответ</span>
        </div>

        <form id="messageForm" class="chat-footer">
            <label class="sr-only" for="messageInput">Ваш вопрос</label>
            <textarea id="messageInput" rows="1" maxlength="2000"
                      placeholder="Например: как подготовиться к МРТ?"
                      autocomplete="off"></textarea>
            <button id="sendButton" class="send-button" type="submit"
                    aria-label="Отправить сообщение">➤</button>
        </form>

        <footer class="privacy-note">
            Не сообщайте ФИО, телефон, номер полиса и результаты исследований.
            Помощник не ставит диагнозы.
            <button id="restartChat" type="button">Начать заново</button>
        </footer>
    </section>

    <button id="chatToggle" class="chat-toggle" type="button"
            aria-label="Открыть информационный чат" aria-expanded="false">
        <span aria-hidden="true">💬</span>
    </button>

    <script src="/static/script.js" defer></script>
</body>
</html>
